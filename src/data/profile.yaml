about: |
  I'm a systems integration engineer at Daifuku North America. I work on automated guided vehicle (AGV) and autonomous mobile robot (AMR) systems: I set up how vehicle fleets route through a plant, test them on live production floors, and work through problems with customers on site.

  I came to this from software. I earned a B.S. in Computer Science at Wayne State University, built mobile apps with teams, and supported users and systems in IT internships at OneStream Software and JVIS USA.

  Next, I want to keep growing in robotics and automation, especially where software decides how machines move.

